server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: trainly-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://qdluegpxqgtwkihqisxa.supabase.co/auth/v1
          wk-set-uri: https://qdluegpxqgtwkihqisxa.supabase.co/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}
  jwt:
    jwk-uri: https://qdluegpxqgtwkihqisxa.supabase.co/auth/v1/.well-known/jwks.json

logging:
  level:
    org.springframework.security: TRACE
