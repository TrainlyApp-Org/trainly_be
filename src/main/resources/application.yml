server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  config:
    import: optional:file:.env[.properties],optional:file:trainly_be/.env[.properties]
  application:
    name: trainly-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://qdluegpxqgtwkihqisxa.supabase.co/auth/v1
          wk-set-uri: https://qdluegpxqgtwkihqisxa.supabase.co/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}
  jwt:
    jwk-uri: https://qdluegpxqgtwkihqisxa.supabase.co/auth/v1/.well-known/jwks.json

app:
  admin-user-ids: ${ADMIN_USER_IDS:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  premium-price-id: ${STRIPE_PREMIUM_PRICE_ID:}

billing:
  enabled: ${BILLING_ENABLED:false}

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
